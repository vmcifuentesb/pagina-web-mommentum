name: Deploy MOMMENTUM to Hosting

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Deploy via FTP
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 🔨 Install Dependencies & Build
      run: |
        cd frontend
        npm install
        npm run build

    - name: 🚀 Sync Files to Server via FTP
